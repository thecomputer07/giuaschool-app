# Build iOS gratuita: compila sul runner macOS di GitHub (gratis per i repo pubblici) con
# `eas build --local`, che NON consuma le build cloud di Expo. Certificato e provisioning
# profile restano custoditi da EAS: per la build serve solo il segreto EXPO_TOKEN.
# Con `submit: true` l'.ipa va su TestFlight con `xcrun altool` (niente EAS Submit): servono
# l'app su App Store Connect (bundle com.thecomputer07.giuaschool) e i segreti ASC_API_KEY
# (contenuto del file .p8), ASC_KEY_ID e ASC_ISSUER_ID.
name: iOS build

on:
  workflow_dispatch:
    inputs:
      submit:
        description: Invia a TestFlight al termine
        default: false
        type: boolean
      mac:
        description: Mac di GitHub (se macos-26 resta in coda, prova macos-26-intel)
        default: macos-26
        type: choice
        options: [macos-26, macos-26-intel]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.mac }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Xcode 26.6: con 26.3 (Swift 6.2) expo-modules-jsi di SDK 57 non compila (expo/expo#50067)
      - name: Xcode 26.6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Token Expo presente
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Manca il segreto EXPO_TOKEN: crealo su expo.dev (Access tokens) e aggiungilo in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Dipendenze
        run: npm ci

      - name: Build iOS locale (runner GitHub)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform ios --profile ios --local --non-interactive --output ${{ github.workspace }}/giuaschool.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: giuaschool-ios
          path: giuaschool.ipa
          retention-days: 14

      - name: Invio a TestFlight (altool, senza EAS)
        if: ${{ inputs.submit }}
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -f giuaschool.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
